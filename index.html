<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Математика 2026: Уравнения (Генератор)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; user-select: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        input { user-select: auto; }

        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ffc3a0, #ffafbd, #c9ffbf, #a8e0ff, #e0c3fc); background-size: 400% 400%; animation: gradientBG 15s ease infinite; overflow: hidden; position: relative; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        button { touch-action: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.6);
            width: 96vw; max-width: 1200px; height: 95vh;
            padding: min(20px, 3vh) min(30px, 4vw); display: flex; flex-direction: column; transition: all 0.5s ease; position: relative;
        }
        .glass-panel.battle-active { max-width: 1600px; padding: min(15px, 2vh); }

        h1 { font-size: min(3.5rem, 6vh); color: #1e293b; text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 1); margin-bottom: min(20px, 3vh); text-align: center; }
        h2 { font-size: min(3rem, 5vh); color: #1e293b; text-shadow: 0 0 15px rgba(255, 255, 255, 1); margin-bottom: min(15px, 2vh); text-align: center; }
        p { font-size: min(1.8rem, 3vh); margin-bottom: min(30px, 4vh); color: #334155; font-weight: 700; text-shadow: 0 0 10px rgba(255, 255, 255, 0.9); text-align: center; }

        .glass-btn {
            background: rgba(255, 255, 255, 0.8); border: 3px solid #fff; padding: min(15px, 2vh) min(30px, 4vw); font-size: min(2rem, 3.5vh); font-weight: 800;
            color: #1e293b; border-radius: 25px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 1);
            transition: transform 0.2s, background 0.2s; margin: 0 auto; display: block;
        }
        .glass-btn:active { transform: scale(0.95); background: #fff; }

        .modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: min(20px, 3vh); margin-top: 10px; }
        .mode-btn { font-size: min(1.8rem, 3vh); width: 100%; }
        .mode-btn.arcade { background: linear-gradient(135deg, rgba(201, 255, 191, 0.8), rgba(168, 224, 255, 0.8)); }
        
        .battle-section { margin-top: min(25px, 3vh); padding-top: min(25px, 3vh); border-top: 3px dashed rgba(255,255,255,0.6); width: 100%; text-align: center;}
        .battle-btn { font-size: min(2.2rem, 3.5vh); width: 100%; max-width: 500px; background: linear-gradient(135deg, #ffafbd, #ffc3a0); box-shadow: 0 0 25px rgba(255, 175, 189, 0.8), inset 0 0 15px rgba(255, 255, 255, 1); animation: pulse 2s infinite;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .screen-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; overflow: hidden; }
        #game-screen { display: none; height: 100%; flex-direction: column; width: 100%; overflow: hidden; }

        .name-input {
            width: 100%; max-width: 400px; font-size: min(2rem, 3.5vh); padding: min(15px, 2vh) 25px; margin-bottom: 15px;
            border-radius: 20px; border: 3px solid #fff; background: rgba(255,255,255,0.7);
            text-align: center; font-weight: 700; color: #1e293b; outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 0 15px rgba(255,255,255,0.5); transition: 0.3s;
        }
        .name-input:focus { background: rgba(255,255,255,0.9); border-color: #a8e0ff; }
        .setup-btns { display: flex; gap: 20px; margin-top: min(20px, 3vh); flex-wrap: wrap; justify-content: center;}
        
        .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: min(50px, 7vh); margin-bottom: min(10px, 1.5vh); position: relative; z-index: 10;}
        .header-left, .header-right { width: 200px; display: flex; align-items: center; }
        .header-right { justify-content: flex-end; }
        .header-center { flex: 1; display: flex; justify-content: center; align-items: center; }

        .desktop-battle-bar { display: none; width: 100%; max-width: 600px; }
        .mobile-battle-bar { display: none; }
        
        .battle-timer-bar {
            position: relative; width: 100%; height: min(35px, 5vh);
            background: rgba(255,255,255,0.6); border-radius: 20px; border: 3px solid #fff; 
            box-shadow: 0 0 15px rgba(255,255,255,0.8), inset 0 0 5px rgba(0,0,0,0.1); overflow: hidden;
        }
        .battle-timer-fill { 
            position: absolute; top: 0; left: 0; height: 100%; width: 100%; 
            background: linear-gradient(90deg, #4ade80, #86efac); transition: width 1s linear, background 0.5s ease; 
        }
        .battle-timer-fill.warning { background: linear-gradient(90deg, #facc15, #fef08a); }
        .battle-timer-fill.danger { background: linear-gradient(90deg, #ef4444, #fca5a5); }
        
        .timer-percent {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
        }

        /* Идеально подогнанные песочные часы */
        .hourglass { 
            display: inline-block; 
            font-size: min(1.5rem, 3vh); /* Чуть меньше высоты бара, чтобы не обрезалось */
            line-height: 1;
            animation: flipGlass 4s ease-in-out infinite; 
        }
        @keyframes flipGlass {
            0% { transform: rotate(0deg); }
            10% { transform: rotate(180deg); }
            50% { transform: rotate(180deg); }
            60% { transform: rotate(360deg); }
            100% { transform: rotate(360deg); }
        }

        .exit-btn-global {
            background: rgba(255, 255, 255, 0.9); border: 3px solid #fff; border-radius: 15px; 
            padding: min(8px, 1.2vh) min(15px, 2vw); font-size: min(1.2rem, 2vh); font-weight: 800; color: #1e293b; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            display: flex; align-items: center; justify-content: center; transition: 0.2s; white-space: nowrap;
        }
        .exit-btn-global:active { transform: scale(0.95); }

        #boards-container { display: flex; width: 100%; height: 100%; gap: 10px; overflow: hidden; }
        .board-wrapper { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.3); border-radius: 20px; padding: min(15px, 2vh); border: 2px solid rgba(255,255,255,0.5); position: relative; overflow: hidden; }

        .player-header { font-size: min(1.8rem, 3vh); font-weight: 900; color: #1e293b; text-align: center; margin-bottom: min(5px, 1vh); text-shadow: 0 0 10px #fff; background: rgba(255,255,255,0.6); border-radius: 12px; padding: 8px;}
        .stat-text { font-size: min(1.3rem, 2vh); font-weight: bold; color: #334155; }
        .stat-val { color: #0f172a; font-size: min(1.5rem, 2.5vh); }
        .stat-err { color: #b91c1c; font-size: min(1.5rem, 2.5vh); }

        .progress-bar { background: rgba(255, 255, 255, 0.5); border-radius: 15px; height: min(20px, 3vh); width: 100%; margin-bottom: min(10px, 1.5vh); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.8); flex-shrink: 0;}
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ffafbd, #a8e0ff, #c9ffbf); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px rgba(255, 255, 255, 0.9); }

        .instructions { font-size: min(1.8rem, 3vh); font-weight: bold; color: #334155; text-align: center; margin-bottom: min(5px, 1vh); text-shadow: 0 0 10px #fff; min-height: min(40px, 6vh); display: flex; align-items: center; justify-content: center;}

        .game-layout { display: flex; flex-direction: row; flex: 1; align-items: stretch; justify-content: space-between; overflow: hidden;}
        .left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; border-right: 2px dashed rgba(255,255,255,0.5);}
        .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; position: relative;}

        .emoji-display { font-size: min(5rem, 8vh); margin-bottom: min(5px, 1vh); filter: drop-shadow(0 0 20px rgba(255,255,255,0.9)); animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .math-container { display: flex; flex-direction: column; width: 100%; max-width: 450px; margin: 0 auto; align-items: center; justify-content: center;}
        
        .equation, .check-equation { font-size: min(3.5rem, 6vh); font-weight: 900; color: #0f172a; text-shadow: 0 0 20px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.8); letter-spacing: 2px; margin-bottom: min(10px, 1.5vh); white-space: nowrap; text-align: center; }
        .step-row, .final-check-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: min(2.8rem, 5vh); font-weight: 900; color: #0f172a; text-shadow: 0 0 15px #fff; min-height: min(50px, 7vh); margin-bottom: min(5px, 1vh);}
        
        .math-divider { width: 100%; max-width: 280px; height: 4px; background: #0f172a; border-radius: 2px; margin: min(15px, 2vh) auto; transition: opacity 0.5s; box-shadow: 0 0 10px #fff;}
        .check-title { font-size: min(1.8rem, 3vh); color: #334155; text-transform: uppercase; font-weight: 900; margin-bottom: min(5px, 1vh); text-shadow: 0 0 10px #fff; text-align: center; width: 100%;}
        
        .check-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: min(5px, 1vh) min(15px, 2vw); align-items: center; width: 100%; font-size: min(2.8rem, 5vh); font-weight: 900; color: #0f172a; text-shadow: 0 0 15px #fff; justify-content: center;}
        .c-left { display: flex; justify-content: flex-end; align-items: center; white-space: nowrap; font-weight: 900;}
        .c-eq { display: flex; justify-content: center; align-items: center; font-weight: 900; }
        .c-right { display: flex; justify-content: flex-start; align-items: center; white-space: nowrap; font-weight: 900; }

        .input-area, .final-input-area {
            font-size: min(3rem, 5vh); font-weight: 900; color: #0f172a; background: rgba(255, 255, 255, 0.7); border: min(4px, 0.6vh) solid #fff;
            border-radius: 15px; padding: min(5px, 1vh) min(15px, 2vw); display: flex; align-items: center; justify-content: center;
            min-width: min(100px, 12vh); height: min(60px, 8vh); box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.8); transition: 0.3s;
        }

        .numpad-container { position: relative; width: 100%; max-width: 380px; display: none; flex-direction: column; align-items: center;}
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: min(10px, 1.5vh); width: 100%; background: rgba(255, 255, 255, 0.3); padding: min(15px, 2.5vh); border-radius: 20px; border: 2px solid rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 20px rgba(255,255,255,0.5); }
        .num-btn { background: rgba(255, 255, 255, 0.8); border: 2px solid #fff; border-radius: 12px; font-size: min(2.2rem, 4vh); font-weight: 900; color: #1e293b; height: min(60px, 8vh); cursor: pointer; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05); transition: 0.1s; display: flex; justify-content: center; align-items: center; }
        .num-btn:active { transform: scale(0.92); background: #fff; box-shadow: 0 0 20px rgba(255, 255, 255, 1); }
        .num-btn.action { background: rgba(255, 175, 189, 0.8); color: #0f172a; }
        .num-btn.action.enter { background: rgba(201, 255, 191, 0.9); grid-column: span 3; height: min(65px, 9vh); font-size: min(1.5rem, 2.5vh); text-transform: uppercase; letter-spacing: 2px; }

        .options-container { position: relative; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: min(10px, 1.5vh); pointer-events: none; align-items: center;}
        .options-container.active { pointer-events: auto; }
        .option-btn {
            background: rgba(255, 255, 255, 0.85); border: 4px solid #fff; border-radius: 15px; padding: min(12px, 2vh); font-size: min(2rem, 3.5vh);
            font-weight: 800; color: #1e293b; cursor: pointer; width: 100%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .option-btn:active { transform: scale(0.95); }

        .battle-mode .game-layout { flex-direction: column; justify-content: flex-start; }
        .battle-mode .left-panel { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.5); padding: 5px; flex: none; width: 100%; justify-content: flex-start;}
        .battle-mode .right-panel { width: 100%; padding: 5px; justify-content: center; flex: 1;}
        
        .battle-mode .emoji-display { font-size: min(3rem, 5vh); margin-bottom: 0;}
        .battle-mode .equation, .battle-mode .check-equation { font-size: min(2.2rem, 4vh); margin-bottom: min(5px, 1vh); }
        .battle-mode .step-row, .battle-mode .final-check-row { font-size: min(1.8rem, 3.5vh); min-height: min(38px, 5vh); gap: 5px;}
        .battle-mode .math-divider { max-width: 200px; height: 3px; margin: min(5px, 1vh) auto;}
        .battle-mode .check-title { font-size: min(1.3rem, 2.5vh); margin-bottom: 2px;}
        
        .battle-mode .input-area, .battle-mode .final-input-area { font-size: min(1.8rem, 3vh); height: min(42px, 6vh); min-width: min(70px, 8vh); border-width: 2px;}
        .battle-mode .numpad { gap: min(6px, 1vh); padding: min(10px, 1.5vh); }
        .battle-mode .num-btn { height: min(45px, 6vh); font-size: min(1.8rem, 3vh); border-radius: 10px;}
        .battle-mode .num-btn.action.enter { height: min(50px, 6.5vh); font-size: min(1.2rem, 2vh); }
        .battle-mode .option-btn { font-size: min(1.5rem, 2.8vh); padding: min(8px, 1vh); border-radius: 10px;}

        .result-score { font-size: min(4rem, 7vh); font-weight: 900; color: #0f172a; text-shadow: 0 0 30px rgba(255, 255, 255, 1), 0 0 50px #fff; margin: min(15px, 2vh) 0; text-align: center;}
        .grade-mark { font-size: min(3.5rem, 6vh); font-weight: 900; padding: min(15px, 2vh) min(50px, 6vw); border-radius: 30px; background: rgba(255, 255, 255, 0.8); display: inline-block; margin-bottom: min(20px, 3vh); border: 4px solid #fff; box-shadow: 0 0 30px #fff; text-align: center;}
        
        .copyright { position: absolute; bottom: 3px; width: 100%; text-align: center; font-size: 0.75rem; color: rgba(51, 65, 85, 0.5); font-weight: 500; pointer-events: none; z-index: 5; letter-spacing: 0.5px; }

        @media (max-width: 768px) {
            .glass-panel { padding: 15px; border-radius: 20px; max-height: 98vh; width: 98vw; }
            h1 { font-size: 2.2rem; margin-bottom: 10px;}
            p { font-size: 1.2rem; margin-bottom: 15px;}
            .glass-btn { font-size: 1.3rem; padding: 12px 20px; }
            .modes-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin: 0 auto; }
            .battle-btn { font-size: 1.4rem; padding: 15px; }
            .battle-section { padding-top: 15px; margin-top: 15px;}
            .name-input { font-size: 1.5rem; padding: 10px 15px; max-width: 280px;}

            .glass-panel.battle-active .game-header { display: none !important; }
            .header-left, .header-right { width: 120px; }
            .exit-btn-global { padding: 6px 12px; font-size: 1rem; }

            .mobile-battle-bar { 
                display: flex; flex-direction: row; align-items: center; justify-content: center; 
                width: 100%; padding: 5px 10px; gap: 15px; background: rgba(255,255,255,0.25); border-radius: 20px; margin: 5px 0;
            }
            .mobile-battle-bar .battle-timer-bar { flex: 1; height: 24px; margin: 0; border-width: 2px;}
            .mobile-battle-bar .timer-percent { line-height: 24px; }
            .mobile-battle-bar .hourglass { font-size: 1.1rem; } /* Идеальный размер для узкого мобильного бара */
            
            :not(.battle-mode) > .game-layout { flex-direction: column; justify-content: flex-start;}
            :not(.battle-mode) > .game-layout > .left-panel { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.5); padding-bottom: 10px; flex: none; height: auto;}
            :not(.battle-mode) > .game-layout > .right-panel { padding-top: 15px; flex: 1; justify-content: flex-start;}
            
            .emoji-display { font-size: 3rem; margin-bottom: 5px; }
            .equation, .check-equation { font-size: 2.5rem; margin-bottom: 10px; }
            .step-row, .final-check-row { font-size: 2.2rem; min-height: 40px; }
            .math-divider { max-width: 200px; height: 3px; margin: 10px auto;}
            .check-title { font-size: 1.3rem; }
            
            .input-area, .final-input-area { font-size: 2rem; height: 45px; min-width: 70px; border-width: 3px; padding: 2px 10px;}
            .numpad { gap: 8px; padding: 15px; }
            .num-btn { height: 50px; font-size: 1.8rem; border-radius: 12px;}
            .num-btn.action.enter { height: 55px; font-size: 1.2rem; }
            .option-btn { font-size: 1.3rem; padding: 10px; }
            .instructions { font-size: 1.3rem; min-height: 30px; margin-bottom: 5px; }
            .result-score { font-size: 2.5rem; margin: 10px 0; }
            .grade-mark { font-size: 2.5rem; padding: 10px 30px; }
            #percent-container { font-size: 1.8rem !important; }

            #boards-container { flex-direction: column; gap: 5px; } 
            .board-wrapper { padding: 6px; border-radius: 15px;}
            #board-p1 { transform: rotate(180deg); }
            
            .battle-mode .game-layout { flex-direction: row; align-items: center; } 
            .battle-mode .left-panel { border-bottom: none; border-right: 2px dashed rgba(255,255,255,0.4); padding: 5px; width: 45%; }
            .battle-mode .right-panel { padding: 5px; width: 55%; flex: 1;}
            .player-header { font-size: 1.2rem; padding: 4px; margin-bottom: 2px; }
            .stat-text { font-size: 0.9rem; }
            .stat-val, .stat-err { font-size: 1.1rem; }
            
            .battle-mode .emoji-display { font-size: 1.8rem; margin-bottom: 0; }
            .battle-mode .equation, .battle-mode .check-equation { font-size: 1.6rem; }
            .battle-mode .step-row, .battle-mode .final-check-row { font-size: 1.2rem; min-height: 25px; gap: 3px;}
            .battle-mode .math-divider { max-width: 150px; margin: 2px auto; }
            .battle-mode .check-title { display: none; }
            
            .battle-mode .input-area, .battle-mode .final-input-area { font-size: 1.3rem; height: 32px; min-width: 50px; border-width: 2px; padding: 2px 5px; border-radius: 8px;}
            .battle-mode .option-btn { font-size: 0.9rem; padding: 8px; }
            .battle-mode .numpad { gap: 4px; padding: 5px; }
            .battle-mode .num-btn { height: 35px; font-size: 1.2rem; border-radius: 8px; border-width: 1px;}
            .battle-mode .num-btn.action.enter { height: 35px; font-size: 0.9rem; }
            .battle-mode .instructions { display: none; }
        }
    </style>
</head>
<body>

    <div id="main-panel" class="glass-panel">
        
        <div id="auth-screen" class="screen-container" style="display: none;">
            <div class="emoji-display">🔐</div>
            <h2>Доступ закрыт</h2>
            <p style="font-size: 1.5rem; margin-bottom: 5px;">Введите пароль, чтобы начать</p>
            <div id="auth-error-msg" style="color: #ef4444; font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; height: 20px; opacity: 0; transition: 0.3s;">Неверный пароль!</div>
            <input type="text" id="access-code-input" class="name-input" placeholder="Пароль" autocomplete="off">
            <button class="glass-btn" onclick="checkAccessCode()">Войти</button>
        </div>

        <div id="start-screen" class="screen-container" style="display: none;">
            <div class="emoji-display">✨🏫✨</div>
            <h1>Уравнения</h1>
            <p>Выбери, сколько уравнений хочешь решить:</p>
            <div class="modes-grid">
                <button class="glass-btn mode-btn" onpointerdown="startGame(3)">3 уравнения</button>
                <button class="glass-btn mode-btn" onpointerdown="startGame(5)">5 уравнений</button>
                <button class="glass-btn mode-btn" onpointerdown="startGame(10)">10 уравнений</button>
                <button class="glass-btn mode-btn arcade" onpointerdown="startGame('arcade')">Аркада (∞)</button>
            </div>
            <div class="battle-section">
                <button class="glass-btn battle-btn" onpointerdown="showSetupScreen()">⚔️ БАТТЛ ⚔️</button>
            </div>
        </div>

        <div id="setup-screen" class="screen-container" style="display: none;">
            <div class="emoji-display">📝</div>
            <h2>Имена игроков</h2>
            <input type="text" id="input-p1" class="name-input" placeholder="Игрок 1" autocomplete="off">
            <input type="text" id="input-p2" class="name-input" placeholder="Игрок 2" autocomplete="off">
            <div class="setup-btns">
                <button class="glass-btn" style="background: rgba(255,175,189,0.9);" onclick="initApp()">Назад</button>
                <button class="glass-btn" style="background: rgba(201,255,191,0.9);" onclick="startBattle()">В БОЙ 🚀</button>
            </div>
        </div>

        <div id="game-screen" class="screen-container" style="display: none;">
            
            <div class="game-header">
                <div class="header-left"></div>
                <div class="header-center">
                    <div id="battle-header-desk" class="desktop-battle-bar">
                        <div class="battle-timer-bar">
                            <div id="battle-timer-fill-desk" class="battle-timer-fill"></div>
                            <span id="timer-percent-desk" class="timer-percent"><div class="hourglass">⏳</div></span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="exit-btn-global" id="exit-btn-global" onpointerdown="resetGame()">На главную 🏠</button>
                </div>
            </div>

            <div id="boards-container"></div>
        </div>

        <div id="result-screen" class="screen-container" style="display: none;">
            <h2 id="result-title">Урок окончен!</h2>
            <div id="result-emoji" class="emoji-display">🏆</div>
            <div class="result-score" id="score-block">Решено: <span id="score-text">0</span></div>
            <div id="percent-container" style="font-size: 2.5rem; font-weight: bold; color: #334155; margin-bottom: 20px; text-shadow: 0 0 10px #fff;">
                Точность: <span id="percent-text">100</span>%
            </div>
            <div id="grade-text" class="grade-mark">Оценка: 5</div>
            <p id="feedback-text">Молодец! Отличная работа!</p>
            <button class="glass-btn" onclick="resetGame()" style="margin-top: 20px;">В главное меню 🔄</button>
        </div>

    </div>

    <div class="copyright">© 2026 Иванова Наталья Александровна</div>

    <script>
        // =========================================================================
        // P.S. Я знаю, что любой может увидеть пароль через F12, но абсолютное большинство об этом не догадывается :)
        const GLOBAL_PASSWORD = "медуза"; 
        // =========================================================================

        let isBattleMode = false;
        let battleTimerInterval = null;
        let players = {};
        let currentScreenId = 'start-screen';

        const mainPanel = document.getElementById('main-panel');
        const boardsContainer = document.getElementById('boards-container');
        const battleHeaderDesk = document.getElementById('battle-header-desk');
        const exitBtnGlobal = document.getElementById('exit-btn-global');

        window.onload = () => {
            initApp();
            setInterval(() => {
                let storedCode = sessionStorage.getItem('userEnteredCode') || "";
                if (GLOBAL_PASSWORD !== "" && storedCode.toLowerCase() !== GLOBAL_PASSWORD.toLowerCase()) {
                    if (currentScreenId !== 'auth-screen') {
                        initApp();
                    }
                }
            }, 1000);
        };

        function showScreen(id) {
            currentScreenId = id;
            const screens = ['start-screen', 'setup-screen', 'game-screen', 'result-screen', 'auth-screen'];
            screens.forEach(s => {
                let el = document.getElementById(s);
                if (el) el.style.display = (s === id) ? 'flex' : 'none';
            });
        }

        function initApp() {
            let storedCode = sessionStorage.getItem('userEnteredCode') || "";
            if (GLOBAL_PASSWORD !== "") {
                if (storedCode.toLowerCase() === GLOBAL_PASSWORD.toLowerCase()) {
                    showScreen('start-screen');
                } else {
                    document.getElementById('access-code-input').value = '';
                    document.getElementById('auth-error-msg').style.opacity = '0';
                    showScreen('auth-screen');
                }
            } else {
                showScreen('start-screen');
            }
        }

        function checkAccessCode() {
            let input = document.getElementById('access-code-input').value.trim();
            if (input.toLowerCase() === GLOBAL_PASSWORD.toLowerCase()) {
                sessionStorage.setItem('userEnteredCode', input);
                document.getElementById('auth-error-msg').style.opacity = '0';
                showScreen('start-screen');
            } else {
                let errMsg = document.getElementById('auth-error-msg');
                errMsg.style.opacity = '1';
                setTimeout(() => { errMsg.style.opacity = '0'; }, 3000);
            }
        }

        function showSetupScreen() { showScreen('setup-screen'); }

        function generateQuestion() {
            const type = Math.floor(Math.random() * 4);
            const emojis = ["🍓", "🍄", "🚀", "🦊", "🍪", "🌟", "🍎", "🎨", "🍒", "🧸", "🦄", "🦕", "⚽", "🍔"];
            const letters = ["x", "y", "z", "a", "b", "c", "m", "n", "p", "k"];
            
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const v = letters[Math.floor(Math.random() * letters.length)];
            
            let a, b, c, x, eq, ans, step1Correct, step1Wrong, checkCorrect, checkWrong, finalCheck;

            if (type === 0 || type === 1) { 
                a = Math.floor(Math.random() * 40) + 5; 
                x = Math.floor(Math.random() * 40) + 5; 
                c = a + x;
                eq = type === 0 ? `${v} + ${a} = ${c}` : `${a} + ${v} = ${c}`;
                ans = x.toString();
                step1Correct = `${c} - ${a}`;
                step1Wrong = [`${c} + ${a}`, `${a} - ${c}`, `${v} - ${a}`];
                checkCorrect = type === 0 ? `${x} + ${a} = ${c}` : `${a} + ${x} = ${c}`;
                checkWrong = [`${c} - ${a} = ${x}`, type === 0 ? `${x} - ${a} = ${c}` : `${a} - ${x} = ${c}`];
                finalCheck = `${c} = ${c}`;
            } else if (type === 2) { 
                b = Math.floor(Math.random() * 40) + 5;
                c = Math.floor(Math.random() * 40) + 5;
                x = b + c;
                eq = `${v} - ${b} = ${c}`;
                ans = x.toString();
                step1Correct = `${c} + ${b}`; 
                step1Wrong = [`${c} - ${b}`, `${b} - ${c}`, `${v} - ${b}`];
                checkCorrect = `${x} - ${b} = ${c}`;
                checkWrong = [`${x} + ${b} = ${c}`, `${c} + ${b} = ${x}`];
                finalCheck = `${c} = ${c}`;
            } else if (type === 3) { 
                c = Math.floor(Math.random() * 40) + 5;
                x = Math.floor(Math.random() * 40) + 5;
                a = c + x;
                eq = `${a} - ${v} = ${c}`;
                ans = x.toString();
                step1Correct = `${a} - ${c}`;
                step1Wrong = [`${a} + ${c}`, `${c} - ${a}`, `${v} + ${c}`];
                checkCorrect = `${a} - ${x} = ${c}`;
                checkWrong = [`${x} - ${a} = ${c}`, `${a} - ${c} = ${x}`];
                finalCheck = `${c} = ${c}`;
            }

            step1Wrong.sort(() => Math.random() - 0.5);
            checkWrong.sort(() => Math.random() - 0.5);

            return {
                eq, ans, emoji, step1Correct, step1Wrong: [step1Wrong[0], step1Wrong[1]],
                checkCorrect, checkWrong: [checkWrong[0], checkWrong[1]], finalCheck, letter: v
            };
        }

        function createPlayerState(mode, name) {
            return {
                mode: mode, name: name, currentIndex: 0, mistakes: 0, score: 0, 
                currentStage: 1, currentOptions: [], correctOptionIndex: -1, currentInput: "", currentQuestion: null
            };
        }

        function getBoardHTML(id, isBattle, playerName) {
            const headerHTML = isBattle ? `
                <div class="player-header">
                    ${playerName}<br>
                    <span class="stat-text">Счет: <span id="${id}-score" class="stat-val">0</span> | Ошибки: <span id="${id}-errors" class="stat-err">0</span></span>
                </div>` : '';

            return `
            <div class="board-wrapper ${isBattle ? 'battle-mode' : ''}" id="board-${id}">
                ${headerHTML}
                <div class="progress-bar" style="${isBattle ? 'display:none;' : ''}"><div id="${id}-progress" class="progress-fill"></div></div>
                
                <div class="instructions" id="${id}-instruction-text">Выбери, как найти x:</div>

                <div class="game-layout">
                    <div class="left-panel">
                        <div id="${id}-emoji" class="emoji-display">🍓</div>
                        
                        <div class="math-container">
                            <div id="${id}-equation" class="equation"></div>
                            
                            <div class="step-row" id="${id}-step1-row" style="opacity: 0;">
                                <span id="${id}-step1-var">x = </span>
                                <div id="${id}-step1-display" style="min-width: 60px; text-align: center;">?</div>
                            </div>
                            
                            <div class="step-row" id="${id}-step2-row" style="opacity: 0;">
                                <span id="${id}-step2-var">x = </span>
                                <div id="${id}-input-display" class="input-area"></div>
                            </div>
                            
                            <div id="${id}-divider" class="math-divider" style="opacity: 0;"></div>
                            
                            <div id="${id}-step3-container" style="opacity: 0; width: 100%; text-align: center;">
                                <div class="check-title">ПРОВЕРКА:</div>
                                <div id="${id}-check-display" class="check-equation">?</div>
                                
                                <div id="${id}-final-check-row" class="final-check-row" style="opacity: 0; display: none;">
                                    <div id="${id}-final-input" class="input-area final-input-area"></div>
                                    <span id="${id}-final-eq">=</span>
                                    <span id="${id}-final-right"></span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="right-panel">
                        <div id="${id}-options-block" class="options-container">
                            <button class="option-btn" id="${id}-opt-btn-0" onpointerdown="selectOption('${id}', 0)"></button>
                            <button class="option-btn" id="${id}-opt-btn-1" onpointerdown="selectOption('${id}', 1)"></button>
                            <button class="option-btn" id="${id}-opt-btn-2" onpointerdown="selectOption('${id}', 2)"></button>
                        </div>

                        <div id="${id}-numpad-block" class="numpad-container">
                            <div class="numpad">
                                ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-btn" onpointerdown="inputNum('${id}', '${n}')">${n}</button>`).join('')}
                                <button class="num-btn action" onpointerdown="deleteNum('${id}')">⌫</button>
                                <button class="num-btn" onpointerdown="inputNum('${id}', '0')">0</button>
                                <div style="visibility: hidden;"></div> 
                                <button class="num-btn action enter" onpointerdown="submitNum('${id}')">Дальше ➔</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function startGame(mode) {
            isBattleMode = false;
            mainPanel.classList.remove('battle-active');
            showScreen('game-screen');
            battleHeaderDesk.style.display = 'none';
            exitBtnGlobal.style.display = 'flex';
            
            boardsContainer.innerHTML = getBoardHTML('single', false, 'Игрок');
            players = { 'single': createPlayerState(mode, 'Игрок') };
            loadQuestion('single');
        }

        function startBattle() {
            isBattleMode = true;
            mainPanel.classList.add('battle-active');
            showScreen('game-screen');
            battleHeaderDesk.style.display = 'flex'; 
            exitBtnGlobal.style.display = 'flex'; 

            let p1Name = document.getElementById('input-p1').value.trim() || 'Игрок 1';
            let p2Name = document.getElementById('input-p2').value.trim() || 'Игрок 2';

            boardsContainer.innerHTML = 
                getBoardHTML('p1', true, p1Name) + 
                
                `<div id="mobile-battle-bar" class="mobile-battle-bar">
                    <div class="battle-timer-bar" style="margin: 0; width: 100%;">
                        <div id="battle-timer-fill-mob" class="battle-timer-fill"></div>
                        <span id="timer-percent-mob" class="timer-percent"><div class="hourglass">⏳</div></span>
                    </div>
                </div>` + 
                
                getBoardHTML('p2', true, p2Name);

            players = {
                'p1': createPlayerState('arcade', p1Name),
                'p2': createPlayerState('arcade', p2Name)
            };

            loadQuestion('p1');
            loadQuestion('p2');
            startTimer(120); 
        }

        function loadQuestion(id) {
            let p = players[id];
            p.currentQuestion = generateQuestion();
            
            document.getElementById(`${id}-equation`).innerText = p.currentQuestion.eq;
            document.getElementById(`${id}-emoji`).innerText = p.currentQuestion.emoji;
            document.getElementById(`${id}-step1-var`).innerText = p.currentQuestion.letter + " = ";
            document.getElementById(`${id}-step2-var`).innerText = p.currentQuestion.letter + " = ";
            
            if (!isBattleMode) {
                let progressFill = document.getElementById(`${id}-progress`);
                if (p.mode === 'arcade') {
                    progressFill.style.width = ((p.currentIndex % 10) / 10 * 100) + '%';
                } else {
                    progressFill.style.width = (p.currentIndex / p.mode * 100) + '%';
                }
            }
            
            document.getElementById(`${id}-step1-row`).style.opacity = '1';
            document.getElementById(`${id}-step1-display`).innerText = "?";
            document.getElementById(`${id}-step2-row`).style.opacity = '0';
            
            document.getElementById(`${id}-divider`).style.opacity = '0';
            document.getElementById(`${id}-step3-container`).style.opacity = '0';
            
            document.getElementById(`${id}-check-display`).style.display = "block";
            document.getElementById(`${id}-check-display`).innerText = "?";
            document.getElementById(`${id}-final-check-row`).style.opacity = '0';
            document.getElementById(`${id}-final-check-row`).style.display = 'none';
            
            let finalInput = document.getElementById(`${id}-final-input`);
            let finalEq = document.getElementById(`${id}-final-eq`);
            let finalRight = document.getElementById(`${id}-final-right`);

            finalEq.style.color = "";
            finalRight.style.color = "";
            finalInput.style.color = "";
            finalInput.style.borderColor = "#fff";
            finalInput.style.background = "rgba(255, 255, 255, 0.7)";
            finalInput.innerText = "";
            
            let inputDisplay = document.getElementById(`${id}-input-display`);
            inputDisplay.innerText = "";
            inputDisplay.style.borderColor = "#fff";
            inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
            p.currentInput = "";

            document.getElementById(`${id}-numpad-block`).style.display = 'none';
            let optBlock = document.getElementById(`${id}-options-block`);
            optBlock.style.display = 'none';
            optBlock.classList.remove('active');

            startStage1(id);
        }

        function startStage1(id) {
            let p = players[id];
            p.currentStage = 1;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Выбери, как найти " + p.currentQuestion.letter + ":";
            
            p.currentOptions = [p.currentQuestion.step1Correct, p.currentQuestion.step1Wrong[0], p.currentQuestion.step1Wrong[1]];
            shuffleOptions(id);
            showOptions(id);
        }

        function startStage2(id) {
            let p = players[id];
            p.currentStage = 2;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Посчитай " + p.currentQuestion.letter + ":";
            
            document.getElementById(`${id}-step2-row`).style.opacity = '1';
            
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.classList.remove('active');
            setTimeout(() => {
                optionsBlock.style.display = 'none';
                document.getElementById(`${id}-numpad-block`).style.display = 'flex';
            }, 300);
        }

        function startStage3(id) {
            let p = players[id];
            p.currentStage = 3;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Выбери проверку:";
            
            document.getElementById(`${id}-divider`).style.opacity = '1';
            document.getElementById(`${id}-step3-container`).style.opacity = '1';
            
            p.currentOptions = [p.currentQuestion.checkCorrect, p.currentQuestion.checkWrong[0], p.currentQuestion.checkWrong[1]];
            shuffleOptions(id);
            
            document.getElementById(`${id}-numpad-block`).style.display = 'none';
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.style.display = 'flex';
            setTimeout(() => { showOptions(id); }, 50);
        }

        function startStage4(id) {
            let p = players[id];
            p.currentStage = 4;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Посчитай левую часть:";
            
            let parts = p.currentQuestion.checkCorrect.split(" = ");
            document.getElementById(`${id}-final-right`).innerText = parts[1];
            
            document.getElementById(`${id}-final-check-row`).style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById(`${id}-final-check-row`).style.opacity = '1';
            }, 50);
            
            p.currentInput = "";
            document.getElementById(`${id}-final-input`).innerText = "";
            
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.classList.remove('active');
            setTimeout(() => {
                optionsBlock.style.display = 'none';
                document.getElementById(`${id}-numpad-block`).style.display = 'flex';
            }, 300);
        }

        function shuffleOptions(id) {
            let p = players[id];
            let correctVal = p.currentOptions[0];
            p.currentOptions.sort(() => Math.random() - 0.5);
            p.correctOptionIndex = p.currentOptions.indexOf(correctVal);
        }

        function showOptions(id) {
            let p = players[id];
            for(let i=0; i<3; i++) {
                let btn = document.getElementById(`${id}-opt-btn-${i}`);
                btn.innerText = p.currentOptions[i];
                btn.style.background = "rgba(255, 255, 255, 0.85)";
                btn.style.borderColor = "#fff";
                btn.disabled = false;
            }
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.style.display = 'flex';
            optionsBlock.classList.add('active');
        }

        function registerMistake(id) {
            let p = players[id];
            p.mistakes++;
            if (isBattleMode) {
                document.getElementById(`${id}-errors`).innerText = p.mistakes;
            }
        }

        function selectOption(id, index) {
            let p = players[id];
            let optBtns = [
                document.getElementById(`${id}-opt-btn-0`),
                document.getElementById(`${id}-opt-btn-1`),
                document.getElementById(`${id}-opt-btn-2`)
            ];

            if(index === p.correctOptionIndex) {
                optBtns[index].style.background = "#c9ffbf";
                optBtns[index].style.borderColor = "#4ade80";
                optBtns.forEach(btn => btn.disabled = true);
                
                if (p.currentStage === 1) {
                    setTimeout(() => {
                        document.getElementById(`${id}-step1-display`).innerText = p.currentOptions[index];
                        startStage2(id);
                    }, 800);
                } else if (p.currentStage === 3) {
                    document.getElementById(`${id}-check-display`).innerText = p.currentOptions[index];
                    setTimeout(() => { startStage4(id); }, 600);
                }
            } else {
                optBtns[index].style.background = "#ffafbd";
                optBtns[index].style.borderColor = "#f87171";
                registerMistake(id);
            }
        }

        function inputNum(id, num) {
            let p = players[id];
            if (p.currentInput.length < 3) {
                p.currentInput += num;
                if (p.currentStage === 2) {
                    document.getElementById(`${id}-input-display`).innerText = p.currentInput;
                } else if (p.currentStage === 4) {
                    document.getElementById(`${id}-final-input`).innerText = p.currentInput;
                }
            }
        }

        function deleteNum(id) {
            let p = players[id];
            p.currentInput = p.currentInput.slice(0, -1);
            if (p.currentStage === 2) {
                document.getElementById(`${id}-input-display`).innerText = p.currentInput;
            } else if (p.currentStage === 4) {
                document.getElementById(`${id}-final-input`).innerText = p.currentInput;
            }
        }

        function submitNum(id) {
            let p = players[id];
            if (p.currentInput === "") return;
            
            if (p.currentStage === 2) {
                let inputDisplay = document.getElementById(`${id}-input-display`);
                if (p.currentInput === p.currentQuestion.ans) {
                    inputDisplay.style.borderColor = "#4ade80";
                    inputDisplay.style.background = "#c9ffbf";
                    setTimeout(() => {
                        inputDisplay.style.borderColor = "#fff";
                        inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
                        startStage3(id);
                    }, 800);
                } else {
                    inputDisplay.style.borderColor = "#f87171";
                    inputDisplay.style.background = "#ffafbd";
                    registerMistake(id);
                    setTimeout(() => {
                        inputDisplay.style.borderColor = "#fff";
                        inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
                        p.currentInput = "";
                        inputDisplay.innerText = "";
                    }, 800);
                }
            } else if (p.currentStage === 4) {
                let inputDisplay = document.getElementById(`${id}-final-input`);
                let parts = p.currentQuestion.checkCorrect.split(" = ");
                let correctSum = parts[1]; 
                
                if (p.currentInput === correctSum) {
                    inputDisplay.style.borderColor = "#4ade80";
                    inputDisplay.style.background = "#c9ffbf";
                    inputDisplay.style.color = "#15803d";
                    document.getElementById(`${id}-final-eq`).style.color = "#15803d";
                    document.getElementById(`${id}-final-right`).style.color = "#15803d";
                    
                    setTimeout(() => {
                        nextQuestion(id);
                    }, 1500);
                } else {
                    inputDisplay.style.borderColor = "#f87171";
                    inputDisplay.style.background = "#ffafbd";
                    registerMistake(id);
                    setTimeout(() => {
                        inputDisplay.style.borderColor = "#fff";
                        inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
                        p.currentInput = "";
                        inputDisplay.innerText = "";
                    }, 800);
                }
            }
        }

        function nextQuestion(id) {
            let p = players[id];
            p.currentIndex++;
            
            if (isBattleMode) {
                p.score++;
                document.getElementById(`${id}-score`).innerText = p.score;
                loadQuestion(id);
            } else {
                if (p.mode === 'arcade' || p.currentIndex < p.mode) {
                    loadQuestion(id);
                } else {
                    endGame();
                }
            }
        }

        function startTimer(seconds) {
            let totalTime = seconds;
            let timeLeft = seconds;
            
            const fillDesk = document.getElementById('battle-timer-fill-desk');
            const fillMob = document.getElementById('battle-timer-fill-mob');
            
            if(fillDesk) { fillDesk.style.width = '100%'; fillDesk.className = 'battle-timer-fill'; }
            if(fillMob) { fillMob.style.width = '100%'; fillMob.className = 'battle-timer-fill'; }
            
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            
            battleTimerInterval = setInterval(() => {
                timeLeft--;
                
                let percentage = Math.ceil((timeLeft / totalTime) * 100);
                let w = percentage + '%';
                let c = 'battle-timer-fill';
                
                if (percentage <= 30 && percentage > 10) c += ' warning';
                else if (percentage <= 10) c += ' danger';
                
                if(fillDesk) { fillDesk.style.width = w; fillDesk.className = c; }
                if(fillMob) { fillMob.style.width = w; fillMob.className = c; }
                
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            mainPanel.classList.remove('battle-active');
            if (isBattleMode) showBattleResults();
            else showSingleResults();
        }

        function showSingleResults() {
            showScreen('result-screen');
            let p = players['single'];
            let totalQuestions = (p.mode === 'arcade') ? p.currentIndex : p.mode;
            
            let gradeElem = document.getElementById('grade-text');
            let feedbackElem = document.getElementById('feedback-text');
            let emojiElem = document.getElementById('result-emoji');
            let scoreBlock = document.getElementById('score-block');
            let percentContainer = document.getElementById('percent-container');
            let percentText = document.getElementById('percent-text');
            
            document.getElementById('result-title').innerText = "Урок окончен!";

            if (totalQuestions === 0) {
                scoreBlock.innerText = "Ты не решил ни одного уравнения";
                percentContainer.style.display = 'none';
                gradeElem.style.display = 'none';
                feedbackElem.innerText = "Возвращайся, когда будешь готов!";
                emojiElem.innerText = "😴";
                return;
            }

            percentContainer.style.display = 'block';
            gradeElem.style.display = 'inline-block';
            scoreBlock.innerHTML = `Решено: <span id="score-text">${totalQuestions}</span>`;
            
            let totalSteps = totalQuestions * 3; 
            let correctSteps = Math.max(0, totalSteps - p.mistakes);
            let percent = Math.round((correctSteps / totalSteps) * 100);
            
            percentText.innerText = percent;

            if (percent >= 90) {
                gradeElem.innerText = "Оценка: 5";
                feedbackElem.innerText = "Блестяще! Замечательный результат ✨";
                emojiElem.innerText = "🏆";
                gradeElem.style.color = "#15803d"; 
            } else if (percent >= 70) {
                gradeElem.innerText = "Оценка: 4";
                feedbackElem.innerText = "Хорошая работа! Были небольшие неточности 👍";
                emojiElem.innerText = "⭐";
                gradeElem.style.color = "#0369a1"; 
            } else if (percent >= 50) {
                gradeElem.innerText = "Оценка: 3";
                feedbackElem.innerText = "Нужно быть внимательнее. Повтори правила! 📚";
                emojiElem.innerText = "🧐";
                gradeElem.style.color = "#b45309"; 
            } else {
                gradeElem.innerText = "Оценка: 2";
                feedbackElem.innerText = "Пока слишком много ошибок. Давай попробуем еще раз! 💪";
                emojiElem.innerText = "🌱";
                gradeElem.style.color = "#b91c1c"; 
            }
        }

        function showBattleResults() {
            showScreen('result-screen');
            let p1 = players['p1'];
            let p2 = players['p2'];
            
            let p1Pts = (p1.score * 10) - (p1.mistakes * 5);
            let p2Pts = (p2.score * 10) - (p2.mistakes * 5);
            
            let winnerText = "";
            let emoji = "🏆";
            
            if (p1Pts > p2Pts) {
                winnerText = "Победил(а) " + p1.name + "!";
                emoji = "🎉";
            } else if (p2Pts > p1Pts) {
                winnerText = "Победил(а) " + p2.name + "!";
                emoji = "🎉";
            } else {
                if (p1.mistakes < p2.mistakes) {
                    winnerText = "Победил(а) " + p1.name + " (точнее)!";
                } else if (p2.mistakes < p1.mistakes) {
                    winnerText = "Победил(а) " + p2.name + " (точнее)!";
                } else {
                    winnerText = "Идеальная ничья!";
                    emoji = "🤝";
                }
            }
            
            document.getElementById('result-title').innerText = "Время вышло!";
            document.getElementById('result-emoji').innerText = emoji;
            
            document.getElementById('score-block').innerHTML = 
                `<div style="font-size:1.5rem; line-height: 1.6; text-align: left; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; width: 100%; max-width: 350px; margin: 0 auto;">
                    <b>${p1.name}:</b> <span style="color:#15803d">${p1.score}</span> решено | <span style="color:#b91c1c">${p1.mistakes}</span> ошибок 👉 <b>${p1Pts} очков</b><br>
                    <b>${p2.name}:</b> <span style="color:#15803d">${p2.score}</span> решено | <span style="color:#b91c1c">${p2.mistakes}</span> ошибок 👉 <b>${p2Pts} очков</b>
                 </div>`;
            
            let gradeElem = document.getElementById('grade-text');
            gradeElem.innerText = winnerText;
            gradeElem.style.color = "#0f172a";
            gradeElem.style.display = 'inline-block';
            
            document.getElementById('percent-container').style.display = 'none';
            document.getElementById('feedback-text').innerText = "Очки = (Решено × 10) - (Ошибки × 5)";
        }

        function resetGame() {
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            mainPanel.classList.remove('battle-active');
            initApp();
        }
    </script>
</body>
</html>
