<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Математика 2026: Уравнения (Генератор)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; user-select: none; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ffc3a0, #ffafbd, #c9ffbf, #a8e0ff, #e0c3fc); background-size: 400% 400%; animation: gradientBG 15s ease infinite; overflow: hidden; position: relative; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        button { touch-action: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.6);
            width: 96vw; max-width: 1200px; height: 95vh;
            padding: 30px; display: flex; flex-direction: column; transition: all 0.5s ease; position: relative;
        }
        .glass-panel.battle-active { 
            max-width: 1600px; 
            padding: 15px; 
        }

        h1 { font-size: 3.5rem; color: #1e293b; text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 1); margin-bottom: 20px; text-align: center; }
        h2 { font-size: 3rem; color: #1e293b; text-shadow: 0 0 15px rgba(255, 255, 255, 1); margin-bottom: 15px; text-align: center; }
        p { font-size: 1.8rem; margin-bottom: 30px; color: #334155; font-weight: 700; text-shadow: 0 0 10px rgba(255, 255, 255, 0.9); text-align: center; }

        .glass-btn {
            background: rgba(255, 255, 255, 0.8); border: 3px solid #fff; padding: 15px 30px; font-size: 2rem; font-weight: 800;
            color: #1e293b; border-radius: 25px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 1);
            transition: transform 0.2s, background 0.2s; margin: 0 auto; display: block;
        }
        .glass-btn:active { transform: scale(0.95); background: #fff; }

        .modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .mode-btn { font-size: 1.8rem; width: 100%; }
        .mode-btn.arcade { background: linear-gradient(135deg, rgba(201, 255, 191, 0.8), rgba(168, 224, 255, 0.8)); }
        
        .battle-section { margin-top: 25px; padding-top: 25px; border-top: 3px dashed rgba(255,255,255,0.6); width: 100%; text-align: center;}
        .battle-btn { font-size: 2.2rem; width: 100%; max-width: 500px; background: linear-gradient(135deg, #ffafbd, #ffc3a0); box-shadow: 0 0 25px rgba(255, 175, 189, 0.8), inset 0 0 15px rgba(255, 255, 255, 1); animation: pulse 2s infinite;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        #start-screen, #result-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        #game-screen { display: none; height: 100%; flex-direction: column; width: 100%; }

        .battle-header-ui { display: none; width: 100%; justify-content: center; align-items: center; margin-bottom: 10px; }
        .timer { font-size: 3rem; font-weight: 900; background: rgba(255,255,255,0.9); padding: 5px 30px; border-radius: 25px; color: #b91c1c; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.9), inset 0 0 10px rgba(255,0,0,0.1); letter-spacing: 2px;}

        #boards-container { display: flex; width: 100%; height: 100%; gap: 10px; overflow: hidden; }
        .board-wrapper { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.3); border-radius: 20px; padding: 15px; border: 2px solid rgba(255,255,255,0.5); position: relative; overflow: hidden; }
        .board-divider { width: 6px; background: rgba(255,255,255,0.6); border-radius: 3px; display: none; margin: 0 5px; }

        .player-header { font-size: 1.5rem; font-weight: 900; color: #1e293b; text-align: center; margin-bottom: 5px; text-shadow: 0 0 10px #fff; background: rgba(255,255,255,0.6); border-radius: 12px; padding: 8px;}
        .stat-text { font-size: 1.3rem; font-weight: bold; color: #334155; }
        .stat-val { color: #0f172a; font-size: 1.5rem; }
        .stat-err { color: #b91c1c; font-size: 1.5rem; }

        .progress-bar { background: rgba(255, 255, 255, 0.5); border-radius: 15px; height: 20px; width: 100%; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.8); flex-shrink: 0;}
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ffafbd, #a8e0ff, #c9ffbf); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 10px rgba(255, 255, 255, 0.9); }

        .instructions { font-size: 1.8rem; font-weight: bold; color: #334155; text-align: center; margin-bottom: 5px; text-shadow: 0 0 10px #fff; min-height: 40px; display: flex; align-items: center; justify-content: center;}

        .game-layout { display: flex; flex-direction: row; flex: 1; align-items: stretch; justify-content: space-between; overflow: hidden;}
        .left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; border-right: 2px dashed rgba(255,255,255,0.5);}
        .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; position: relative;}

        .emoji-display { font-size: 5rem; margin-bottom: 5px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.9)); animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .equation { font-size: 3.5rem; font-weight: 900; color: #0f172a; text-shadow: 0 0 20px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.8); letter-spacing: 2px; margin-bottom: 15px; white-space: nowrap; }

        .step-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;}
        .step-row { display: flex; align-items: center; gap: 10px; font-size: 2.5rem; font-weight: 900; color: #0f172a; text-shadow: 0 0 15px #fff; min-height: 50px;}
        
        .input-area {
            font-size: 3rem; font-weight: 900; color: #0f172a; background: rgba(255, 255, 255, 0.7); border: 4px solid #fff;
            border-radius: 15px; padding: 5px 15px; display: flex; align-items: center; justify-content: center;
            min-width: 100px; height: 60px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .numpad-container { position: absolute; width: 100%; max-width: 380px; transition: opacity 0.3s; display: none; flex-direction: column; align-items: center;}
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; background: rgba(255, 255, 255, 0.3); padding: 15px; border-radius: 20px; border: 2px solid rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 20px rgba(255,255,255,0.5); }
        .num-btn { background: rgba(255, 255, 255, 0.8); border: 2px solid #fff; border-radius: 12px; font-size: 2.2rem; font-weight: 900; color: #1e293b; height: 60px; cursor: pointer; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05); transition: 0.1s; display: flex; justify-content: center; align-items: center; }
        .num-btn:active { transform: scale(0.92); background: #fff; box-shadow: 0 0 20px rgba(255, 255, 255, 1); }
        .num-btn.action { background: rgba(255, 175, 189, 0.8); color: #0f172a; }
        .num-btn.action.enter { background: rgba(201, 255, 191, 0.9); grid-column: span 3; height: 65px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }

        .options-container { position: absolute; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; transition: opacity 0.3s; opacity: 0; pointer-events: none; align-items: center;}
        .options-container.active { opacity: 1; pointer-events: auto; }
        .option-btn {
            background: rgba(255, 255, 255, 0.85); border: 4px solid #fff; border-radius: 15px; padding: 12px; font-size: 2rem;
            font-weight: 800; color: #1e293b; cursor: pointer; width: 100%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .option-btn:active { transform: scale(0.95); }

        .battle-mode .game-layout { flex-direction: column; justify-content: space-evenly; overflow: hidden; }
        .battle-mode .left-panel { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.5); padding: 5px; flex: 1; width: 100%; justify-content: space-evenly;}
        .battle-mode .right-panel { width: 100%; padding: 5px; justify-content: space-evenly; flex: 1;}
        
        .battle-mode .emoji-display { font-size: 3rem; margin-bottom: 0;}
        .battle-mode .equation { font-size: 2.5rem; margin-bottom: 5px; }
        .battle-mode .step-row { font-size: 1.8rem; min-height: 38px; gap: 5px;}
        .battle-mode .input-area { font-size: 1.8rem; height: 42px; min-width: 70px; border-width: 2px;}
        .battle-mode .numpad { gap: 6px; padding: 10px; }
        .battle-mode .num-btn { height: 45px; font-size: 1.8rem; border-radius: 10px;}
        .battle-mode .num-btn.action.enter { height: 50px; font-size: 1.2rem; }
        .battle-mode .option-btn { font-size: 1.5rem; padding: 8px; border-radius: 10px;}

        .result-score { font-size: 4rem; font-weight: 900; color: #0f172a; text-shadow: 0 0 30px rgba(255, 255, 255, 1), 0 0 50px #fff; margin: 15px 0; text-align: center;}
        .grade-mark { font-size: 3.5rem; font-weight: 900; padding: 15px 50px; border-radius: 30px; background: rgba(255, 255, 255, 0.8); display: inline-block; margin-bottom: 20px; border: 4px solid #fff; box-shadow: 0 0 30px #fff; text-align: center;}
        
        .exit-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(255, 175, 189, 0.8); border: 2px solid #fff;
            border-radius: 15px; padding: 10px 20px; font-size: 1.2rem; font-weight: bold; color: #0f172a; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5); z-index: 10; display: block;
        }
        .exit-btn:active { transform: scale(0.95); }

        /* Изящный копирайт */
        .copyright {
            position: absolute;
            bottom: 3px; 
            width: 100%;
            text-align: center;
            font-size: 0.75rem; /* Мелкий шрифт */
            color: rgba(51, 65, 85, 0.5); /* Полупрозрачный */
            font-weight: 500;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 0.5px;
        }

        /* МЕДИА-ЗАПРОСЫ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        @media (max-width: 768px) {
            .glass-panel { padding: 15px; border-radius: 20px; max-height: 98vh; width: 98vw; }
            h1 { font-size: 2.2rem; margin-bottom: 10px;}
            p { font-size: 1.2rem; margin-bottom: 15px;}
            .glass-btn { font-size: 1.3rem; padding: 12px 20px; }
            .modes-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin: 0 auto; }
            .battle-btn { font-size: 1.4rem; padding: 15px; }
            .battle-section { padding-top: 15px; margin-top: 15px;}
            .timer { font-size: 2rem; padding: 5px 15px; }
            .exit-btn { padding: 8px 12px; font-size: 1rem; top: 10px; right: 10px;}

            /* Одиночный режим: панели встают друг под друга */
            :not(.battle-mode) > .game-layout { flex-direction: column; overflow-y: auto; justify-content: flex-start;}
            :not(.battle-mode) > .game-layout > .left-panel { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.5); padding-bottom: 10px; flex: none; height: auto;}
            :not(.battle-mode) > .game-layout > .right-panel { padding-top: 15px; flex: 1; justify-content: flex-start;}
            
            .emoji-display { font-size: 3rem; margin-bottom: 5px; }
            .equation { font-size: 2.5rem; margin-bottom: 10px; }
            .step-row { font-size: 1.6rem; min-height: 40px; }
            .input-area { font-size: 2rem; height: 45px; min-width: 70px; }
            
            .numpad { gap: 8px; padding: 15px; }
            .num-btn { height: 50px; font-size: 1.8rem; border-radius: 12px;}
            .num-btn.action.enter { height: 55px; font-size: 1.2rem; }
            
            .option-btn { font-size: 1.3rem; padding: 10px; }
            .instructions { font-size: 1.3rem; min-height: 30px; margin-bottom: 5px; }

            .result-score { font-size: 2.5rem; margin: 10px 0; }
            .grade-mark { font-size: 2.5rem; padding: 10px 30px; }
            #percent-container { font-size: 1.8rem !important; }

            /* БАТТЛ: Игровые доски встают друг под другом */
            #boards-container { flex-direction: column; gap: 8px; } 
            .board-wrapper { padding: 8px; border-radius: 15px;}
            
            /* Внутри баттла на мобилке левая и правая панель снова бок о бок для экономии высоты */
            .battle-mode .game-layout { flex-direction: row; align-items: center; } 
            .battle-mode .left-panel { border-bottom: none; border-right: 2px dashed rgba(255,255,255,0.4); padding: 5px; width: 45%; }
            .battle-mode .right-panel { padding: 5px; width: 55%; flex: 1;}
            
            .player-header { font-size: 1rem; padding: 4px; margin-bottom: 2px; }
            .stat-text { font-size: 0.8rem; }
            .stat-val, .stat-err { font-size: 1rem; }
            
            .battle-mode .emoji-display { font-size: 1.8rem; margin-bottom: 0; }
            .battle-mode .equation { font-size: 1.6rem; }
            .battle-mode .step-row { font-size: 1rem; min-height: 25px; gap: 3px;}
            .battle-mode .input-area { font-size: 1.1rem; height: 28px; min-width: 40px; border-width: 2px;}
            .battle-mode .option-btn { font-size: 0.9rem; padding: 8px; }
            
            .battle-mode .numpad { gap: 4px; padding: 5px; }
            .battle-mode .num-btn { height: 35px; font-size: 1.2rem; border-radius: 8px; border-width: 1px;}
            .battle-mode .num-btn.action.enter { height: 35px; font-size: 0.9rem; }
            
            /* Скрываем текст инструкции в баттле на мобилках для экономии места */
            .battle-mode .instructions { display: none; }
        }
    </style>
</head>
<body>

    <div id="main-panel" class="glass-panel">
        
        <div id="start-screen">
            <div class="emoji-display">✨🏫✨</div>
            <h1>Уравнения</h1>
            <p>Выбери, сколько примеров хочешь решить:</p>
            <div class="modes-grid">
                <button class="glass-btn mode-btn" onpointerdown="startGame(3)">3 примера</button>
                <button class="glass-btn mode-btn" onpointerdown="startGame(5)">5 примеров</button>
                <button class="glass-btn mode-btn" onpointerdown="startGame(10)">10 примеров</button>
                <button class="glass-btn mode-btn arcade" onpointerdown="startGame('arcade')">Аркада (∞)</button>
            </div>
            <div class="battle-section">
                <button class="glass-btn battle-btn" onpointerdown="startBattle()">⚔️ БАТТЛ (2 МИН) ⚔️</button>
            </div>
        </div>

        <div id="game-screen">
            <button class="exit-btn" id="exit-btn" onpointerdown="resetGame()">Сдаться 🛑</button>
            
            <div id="battle-header" class="battle-header-ui">
                <div class="timer" id="battle-timer">02:00</div>
            </div>

            <div id="boards-container"></div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 id="result-title">Урок окончен!</h2>
            <div id="result-emoji" class="emoji-display">🏆</div>
            <div class="result-score" id="score-block">Решено: <span id="score-text">0</span></div>
            <div id="percent-container" style="font-size: 2.5rem; font-weight: bold; color: #334155; margin-bottom: 20px; text-shadow: 0 0 10px #fff;">
                Точность: <span id="percent-text">100</span>%
            </div>
            <div id="grade-text" class="grade-mark">Оценка: 5</div>
            <p id="feedback-text">Молодец! Отличная работа!</p>
            <button class="glass-btn" onpointerdown="resetGame()" style="margin-top: 20px;">В главное меню 🔄</button>
        </div>

    </div>

    <!-- Твой скорректированный копирайт -->
    <div class="copyright">© 2026 Иванова Наталья Александровна</div>

    <script>
        let isBattleMode = false;
        let battleTimerInterval = null;
        let players = {};

        const mainPanel = document.getElementById('main-panel');
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const boardsContainer = document.getElementById('boards-container');
        const battleHeader = document.getElementById('battle-header');

        function generateQuestion() {
            const type = Math.floor(Math.random() * 4);
            const emojis = ["🍓", "🍄", "🚀", "🦊", "🍪", "🌟", "🍎", "🎨", "🍒", "🧸", "🦄", "🦕", "⚽", "🍔"];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            
            let a, b, c, x, eq, ans, step1Correct, step1Wrong, checkCorrect, checkWrong, finalCheck;

            if (type === 0 || type === 1) { 
                a = Math.floor(Math.random() * 40) + 5; 
                x = Math.floor(Math.random() * 40) + 5; 
                c = a + x;
                eq = type === 0 ? `x + ${a} = ${c}` : `${a} + x = ${c}`;
                ans = x.toString();
                step1Correct = `${c} - ${a}`;
                step1Wrong = [`${c} + ${a}`, `${a} - ${c}`, `x - ${a}`];
                checkCorrect = type === 0 ? `${x} + ${a} = ${c}` : `${a} + ${x} = ${c}`;
                checkWrong = [`${c} - ${a} = ${x}`, type === 0 ? `${x} - ${a} = ${c}` : `${a} - ${x} = ${c}`];
                finalCheck = `${c} = ${c}`;
            } else if (type === 2) { 
                b = Math.floor(Math.random() * 40) + 5;
                c = Math.floor(Math.random() * 40) + 5;
                x = b + c;
                eq = `x - ${b} = ${c}`;
                ans = x.toString();
                step1Correct = `${c} + ${b}`; 
                step1Wrong = [`${c} - ${b}`, `${b} - ${c}`, `x - ${b}`];
                checkCorrect = `${x} - ${b} = ${c}`;
                checkWrong = [`${x} + ${b} = ${c}`, `${c} + ${b} = ${x}`];
                finalCheck = `${c} = ${c}`;
            } else if (type === 3) { 
                c = Math.floor(Math.random() * 40) + 5;
                x = Math.floor(Math.random() * 40) + 5;
                a = c + x;
                eq = `${a} - x = ${c}`;
                ans = x.toString();
                step1Correct = `${a} - ${c}`;
                step1Wrong = [`${a} + ${c}`, `${c} - ${a}`, `${x} + ${c}`];
                checkCorrect = `${a} - ${x} = ${c}`;
                checkWrong = [`${x} - ${a} = ${c}`, `${a} - ${c} = ${x}`];
                finalCheck = `${c} = ${c}`;
            }

            step1Wrong.sort(() => Math.random() - 0.5);
            checkWrong.sort(() => Math.random() - 0.5);

            return {
                eq, ans, emoji, step1Correct, 
                step1Wrong: [step1Wrong[0], step1Wrong[1]],
                checkCorrect, 
                checkWrong: [checkWrong[0], checkWrong[1]],
                finalCheck
            };
        }

        function createPlayerState(mode) {
            return {
                mode: mode,
                currentIndex: 0,
                mistakes: 0,
                score: 0, 
                currentStage: 1,
                currentOptions: [],
                correctOptionIndex: -1,
                currentInput: "",
                currentQuestion: null
            };
        }

        function getBoardHTML(id, isBattle) {
            const playerTitle = id === 'p1' ? 'Игрок 1 (Слева / Верх)' : 'Игрок 2 (Справа / Низ)';
            const headerHTML = isBattle ? `
                <div class="player-header">
                    ${playerTitle}<br>
                    <span class="stat-text">Счет: <span id="${id}-score" class="stat-val">0</span> | Ошибки: <span id="${id}-errors" class="stat-err">0</span></span>
                </div>` : '';

            return `
            <div class="board-wrapper ${isBattle ? 'battle-mode' : ''}" id="board-${id}">
                ${headerHTML}
                <div class="progress-bar" style="${isBattle ? 'display:none;' : ''}"><div id="${id}-progress" class="progress-fill"></div></div>
                
                <div class="instructions" id="${id}-instruction-text">Выбери, как найти x:</div>

                <div class="game-layout">
                    <div class="left-panel">
                        <div id="${id}-emoji" class="emoji-display">🍓</div>
                        <div id="${id}-equation" class="equation"></div>
                        
                        <div class="step-container">
                            <div class="step-row" id="${id}-step1-row" style="opacity: 0;">
                                <span>x = </span>
                                <div id="${id}-step1-display" style="border-bottom: 2px solid #0f172a; min-width: 60px; text-align: center; padding-bottom: 2px;">?</div>
                            </div>
                            <div class="step-row" id="${id}-step2-row" style="opacity: 0;">
                                <span>x = </span>
                                <div id="${id}-input-display" class="input-area"></div>
                            </div>
                            
                            <div class="step-row" id="${id}-step3-row" style="opacity: 0; flex-direction: column; align-items: center; margin-top: 5px;">
                                <span style="font-size: ${isBattle ? '1rem' : '1.8rem'}; color: #334155; text-transform: uppercase;">Проверка:</span>
                                <div style="display: flex; flex-direction: column; align-items: center; gap: 0px;">
                                    <div id="${id}-check-display" style="font-size: ${isBattle ? '1.4rem' : '2.8rem'};"></div>
                                    <div id="${id}-final-check-display" style="font-size: ${isBattle ? '1.4rem' : '2.8rem'}; color: #15803d; opacity: 0; transition: opacity 0.5s;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="right-panel">
                        <div id="${id}-options-block" class="options-container">
                            <button class="option-btn" id="${id}-opt-btn-0" onpointerdown="selectOption('${id}', 0)"></button>
                            <button class="option-btn" id="${id}-opt-btn-1" onpointerdown="selectOption('${id}', 1)"></button>
                            <button class="option-btn" id="${id}-opt-btn-2" onpointerdown="selectOption('${id}', 2)"></button>
                        </div>

                        <div id="${id}-numpad-block" class="numpad-container">
                            <div class="numpad">
                                ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-btn" onpointerdown="inputNum('${id}', '${n}')">${n}</button>`).join('')}
                                <button class="num-btn action" onpointerdown="deleteNum('${id}')">⌫</button>
                                <button class="num-btn" onpointerdown="inputNum('${id}', '0')">0</button>
                                <div style="visibility: hidden;"></div> 
                                <button class="num-btn action enter" onpointerdown="submitNum('${id}')">Дальше ➔</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function startGame(mode) {
            isBattleMode = false;
            mainPanel.classList.remove('battle-active');
            startScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            battleHeader.style.display = 'none';
            
            boardsContainer.innerHTML = getBoardHTML('single', false);

            players = { 'single': createPlayerState(mode) };
            loadQuestion('single');
        }

        function startBattle() {
            isBattleMode = true;
            mainPanel.classList.add('battle-active');
            startScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            battleHeader.style.display = 'flex';

            boardsContainer.innerHTML = 
                getBoardHTML('p1', true) + 
                `<div class="board-divider" style="display:block;"></div>` + 
                getBoardHTML('p2', true);

            players = {
                'p1': createPlayerState('arcade'),
                'p2': createPlayerState('arcade')
            };

            loadQuestion('p1');
            loadQuestion('p2');
            startTimer(120);
        }

        function loadQuestion(id) {
            let p = players[id];
            p.currentQuestion = generateQuestion();
            
            document.getElementById(`${id}-equation`).innerText = p.currentQuestion.eq;
            document.getElementById(`${id}-emoji`).innerText = p.currentQuestion.emoji;
            
            if (!isBattleMode) {
                let progressFill = document.getElementById(`${id}-progress`);
                if (p.mode === 'arcade') {
                    progressFill.style.width = ((p.currentIndex % 10) / 10 * 100) + '%';
                } else {
                    progressFill.style.width = (p.currentIndex / p.mode * 100) + '%';
                }
            }
            
            document.getElementById(`${id}-step1-row`).style.opacity = '1';
            document.getElementById(`${id}-step1-display`).innerText = "?";
            document.getElementById(`${id}-step2-row`).style.opacity = '0';
            document.getElementById(`${id}-step3-row`).style.opacity = '0';
            
            let checkDisplay = document.getElementById(`${id}-check-display`);
            checkDisplay.innerText = "";
            checkDisplay.style.color = "#0f172a";
            
            let finalCheck = document.getElementById(`${id}-final-check-display`);
            finalCheck.innerText = "";
            finalCheck.style.opacity = '0';
            
            let inputDisplay = document.getElementById(`${id}-input-display`);
            inputDisplay.innerText = "";
            inputDisplay.style.borderColor = "#fff";
            inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
            p.currentInput = "";

            startStage1(id);
        }

        function startStage1(id) {
            let p = players[id];
            p.currentStage = 1;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Выбери, как найти x:";
            
            p.currentOptions = [p.currentQuestion.step1Correct, p.currentQuestion.step1Wrong[0], p.currentQuestion.step1Wrong[1]];
            shuffleOptions(id);
            showOptions(id);
        }

        function startStage2(id) {
            let p = players[id];
            p.currentStage = 2;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Посчитай x:";
            
            document.getElementById(`${id}-step2-row`).style.opacity = '1';
            
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.classList.remove('active');
            setTimeout(() => {
                optionsBlock.style.display = 'none';
                document.getElementById(`${id}-numpad-block`).style.display = 'flex';
            }, 300);
        }

        function startStage3(id) {
            let p = players[id];
            p.currentStage = 3;
            
            let instruction = document.getElementById(`${id}-instruction-text`);
            if(instruction) instruction.innerText = "Выбери проверку:";
            
            document.getElementById(`${id}-step3-row`).style.opacity = '1';
            document.getElementById(`${id}-check-display`).innerText = "?";
            
            p.currentOptions = [p.currentQuestion.checkCorrect, p.currentQuestion.checkWrong[0], p.currentQuestion.checkWrong[1]];
            shuffleOptions(id);
            
            document.getElementById(`${id}-numpad-block`).style.display = 'none';
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.style.display = 'flex';
            setTimeout(() => { showOptions(id); }, 50);
        }

        function shuffleOptions(id) {
            let p = players[id];
            let correctVal = p.currentOptions[0];
            p.currentOptions.sort(() => Math.random() - 0.5);
            p.correctOptionIndex = p.currentOptions.indexOf(correctVal);
        }

        function showOptions(id) {
            let p = players[id];
            for(let i=0; i<3; i++) {
                let btn = document.getElementById(`${id}-opt-btn-${i}`);
                btn.innerText = p.currentOptions[i];
                btn.style.background = "rgba(255, 255, 255, 0.85)";
                btn.style.borderColor = "#fff";
                btn.disabled = false;
            }
            let optionsBlock = document.getElementById(`${id}-options-block`);
            optionsBlock.style.display = 'flex';
            optionsBlock.classList.add('active');
        }

        function registerMistake(id) {
            let p = players[id];
            p.mistakes++;
            if (isBattleMode) {
                document.getElementById(`${id}-errors`).innerText = p.mistakes;
            }
        }

        function selectOption(id, index) {
            let p = players[id];
            let optBtns = [
                document.getElementById(`${id}-opt-btn-0`),
                document.getElementById(`${id}-opt-btn-1`),
                document.getElementById(`${id}-opt-btn-2`)
            ];

            if(index === p.correctOptionIndex) {
                optBtns[index].style.background = "#c9ffbf";
                optBtns[index].style.borderColor = "#4ade80";
                optBtns.forEach(btn => btn.disabled = true);
                
                if (p.currentStage === 1) {
                    setTimeout(() => {
                        document.getElementById(`${id}-step1-display`).innerText = p.currentOptions[index];
                        startStage2(id);
                    }, 800);
                } else if (p.currentStage === 3) {
                    document.getElementById(`${id}-check-display`).innerText = p.currentOptions[index];
                    
                    setTimeout(() => {
                        let fCheck = document.getElementById(`${id}-final-check-display`);
                        fCheck.innerText = p.currentQuestion.finalCheck;
                        fCheck.style.opacity = '1';
                    }, 600);

                    setTimeout(() => nextQuestion(id), 1500);
                }
            } else {
                optBtns[index].style.background = "#ffafbd";
                optBtns[index].style.borderColor = "#f87171";
                registerMistake(id);
            }
        }

        function inputNum(id, num) {
            let p = players[id];
            if (p.currentInput.length < 3) {
                p.currentInput += num;
                document.getElementById(`${id}-input-display`).innerText = p.currentInput;
            }
        }

        function deleteNum(id) {
            let p = players[id];
            p.currentInput = p.currentInput.slice(0, -1);
            document.getElementById(`${id}-input-display`).innerText = p.currentInput;
        }

        function submitNum(id) {
            let p = players[id];
            if (p.currentInput === "") return;
            
            let inputDisplay = document.getElementById(`${id}-input-display`);
            if (p.currentInput === p.currentQuestion.ans) {
                inputDisplay.style.borderColor = "#4ade80";
                inputDisplay.style.background = "#c9ffbf";
                setTimeout(() => {
                    inputDisplay.style.borderColor = "#fff";
                    inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
                    startStage3(id);
                }, 800);
            } else {
                inputDisplay.style.borderColor = "#f87171";
                inputDisplay.style.background = "#ffafbd";
                registerMistake(id);
                setTimeout(() => {
                    inputDisplay.style.borderColor = "#fff";
                    inputDisplay.style.background = "rgba(255, 255, 255, 0.7)";
                    p.currentInput = "";
                    inputDisplay.innerText = "";
                }, 800);
            }
        }

        function nextQuestion(id) {
            let p = players[id];
            document.getElementById(`${id}-options-block`).classList.remove('active');
            p.currentIndex++;
            
            if (isBattleMode) {
                p.score++;
                document.getElementById(`${id}-score`).innerText = p.score;
                setTimeout(() => {
                    document.getElementById(`${id}-options-block`).style.display = 'none';
                    loadQuestion(id);
                }, 300);
            } else {
                if (p.mode === 'arcade' || p.currentIndex < p.mode) {
                    setTimeout(() => {
                        document.getElementById(`${id}-options-block`).style.display = 'none';
                        loadQuestion(id);
                    }, 300);
                } else {
                    endGame();
                }
            }
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            const timerDisplay = document.getElementById('battle-timer');
            timerDisplay.innerText = formatTime(timeLeft);
            
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            
            battleTimerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = formatTime(timeLeft);
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        }

        function endGame() {
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'flex';
            mainPanel.classList.remove('battle-active');

            if (isBattleMode) {
                showBattleResults();
            } else {
                showSingleResults();
            }
        }

        function showSingleResults() {
            let p = players['single'];
            let totalQuestions = (p.mode === 'arcade') ? p.currentIndex : p.mode;
            
            let gradeElem = document.getElementById('grade-text');
            let feedbackElem = document.getElementById('feedback-text');
            let emojiElem = document.getElementById('result-emoji');
            let scoreBlock = document.getElementById('score-block');
            let percentContainer = document.getElementById('percent-container');
            let percentText = document.getElementById('percent-text');
            
            document.getElementById('result-title').innerText = "Урок окончен!";

            if (totalQuestions === 0) {
                scoreBlock.innerText = "Ты не решил ни одного примера";
                percentContainer.style.display = 'none';
                gradeElem.style.display = 'none';
                feedbackElem.innerText = "Возвращайся, когда будешь готов!";
                emojiElem.innerText = "😴";
                return;
            }

            percentContainer.style.display = 'block';
            gradeElem.style.display = 'inline-block';
            scoreBlock.innerHTML = `Решено: <span id="score-text">${totalQuestions}</span>`;
            
            let totalSteps = totalQuestions * 3; 
            let correctSteps = Math.max(0, totalSteps - p.mistakes);
            let percent = Math.round((correctSteps / totalSteps) * 100);
            
            percentText.innerText = percent;

            if (percent >= 90) {
                gradeElem.innerText = "Оценка: 5";
                feedbackElem.innerText = "Блестяще! Замечательный результат ✨";
                emojiElem.innerText = "🏆";
                gradeElem.style.color = "#15803d"; 
            } else if (percent >= 70) {
                gradeElem.innerText = "Оценка: 4";
                feedbackElem.innerText = "Хорошая работа! Были небольшие неточности 👍";
                emojiElem.innerText = "⭐";
                gradeElem.style.color = "#0369a1"; 
            } else if (percent >= 50) {
                gradeElem.innerText = "Оценка: 3";
                feedbackElem.innerText = "Нужно быть внимательнее. Повтори правила! 📚";
                emojiElem.innerText = "🧐";
                gradeElem.style.color = "#b45309"; 
            } else {
                gradeElem.innerText = "Оценка: 2";
                feedbackElem.innerText = "Пока слишком много ошибок. Давай попробуем еще раз! 💪";
                emojiElem.innerText = "🌱";
                gradeElem.style.color = "#b91c1c"; 
            }
        }

        function showBattleResults() {
            let p1 = players['p1'];
            let p2 = players['p2'];
            
            let p1Pts = (p1.score * 10) - (p1.mistakes * 5);
            let p2Pts = (p2.score * 10) - (p2.mistakes * 5);
            
            let winnerText = "";
            let emoji = "🏆";
            
            if (p1Pts > p2Pts) {
                winnerText = "Победил Игрок 1 (Верх)!";
                emoji = "🎉";
            } else if (p2Pts > p1Pts) {
                winnerText = "Победил Игрок 2 (Низ)!";
                emoji = "🎉";
            } else {
                if (p1.mistakes < p2.mistakes) {
                    winnerText = "Победил Игрок 1 (точнее)!";
                } else if (p2.mistakes < p1.mistakes) {
                    winnerText = "Победил Игрок 2 (точнее)!";
                } else {
                    winnerText = "Идеальная ничья!";
                    emoji = "🤝";
                }
            }
            
            document.getElementById('result-title').innerText = "Время вышло!";
            document.getElementById('result-emoji').innerText = emoji;
            
            document.getElementById('score-block').innerHTML = 
                `<div style="font-size:1.5rem; line-height: 1.6; text-align: left; background: rgba(255,255,255,0.6); padding: 15px; border-radius: 15px; width: 100%; max-width: 320px; margin: 0 auto;">
                    <b>Игрок 1:</b> <span style="color:#15803d">${p1.score}</span> решено | <span style="color:#b91c1c">${p1.mistakes}</span> ошибок 👉 <b>${p1Pts} очков</b><br>
                    <b>Игрок 2:</b> <span style="color:#15803d">${p2.score}</span> решено | <span style="color:#b91c1c">${p2.mistakes}</span> ошибок 👉 <b>${p2Pts} очков</b>
                 </div>`;
            
            let gradeElem = document.getElementById('grade-text');
            gradeElem.innerText = winnerText;
            gradeElem.style.color = "#0f172a";
            gradeElem.style.display = 'inline-block';
            
            document.getElementById('percent-container').style.display = 'none';
            document.getElementById('feedback-text').innerText = "Очки = (Решено × 10) - (Ошибки × 5)";
        }

        function resetGame() {
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            mainPanel.classList.remove('battle-active');
            startScreen.style.display = 'flex';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'none';
        }
    </script>
</body>
</html>
